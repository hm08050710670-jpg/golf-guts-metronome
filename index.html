<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf7ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GUTS METRONOME">
<link rel="manifest" href="manifest.webmanifest">
<title>GOLF GUTS METRONOME</title>
<style>
:root{--g:#123f2d;--g2:#0b3223;--c:#faf7ef;--i:#181512;--l:#c9c3b9}
*{box-sizing:border-box}html,body{margin:0;background:var(--c);color:var(--i);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue","Noto Sans JP",sans-serif}
body{padding:env(safe-area-inset-top) 14px env(safe-area-inset-bottom)}
.app{max-width:520px;margin:auto;text-align:center;padding:34px 0 28px}.brand{font-size:clamp(38px,11vw,58px);font-weight:650;letter-spacing:.035em;line-height:1}.tag{font-size:12px;font-weight:700;letter-spacing:.18em;margin-top:10px}
.rule{display:flex;align-items:center;gap:18px;margin:30px 8% 24px;color:#244a3a;font-size:11px;letter-spacing:.38em}.rule:before,.rule:after{content:"";height:1px;background:#244a3a;flex:1}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.choice{min-height:108px;border:1.5px solid var(--g);border-radius:34px;background:transparent;color:var(--i)}.choice.selected{background:linear-gradient(145deg,var(--g),var(--g2));color:#fff;border-color:transparent;box-shadow:0 8px 20px rgba(18,63,45,.18)}
.tempoName{display:block;font-size:clamp(34px,10vw,48px);font-weight:800;line-height:1}.bpm{display:block;margin-top:9px;font-size:12px;font-weight:650;letter-spacing:.08em;opacity:.72}.tone{min-height:74px;font-size:34px;font-weight:800}
.signature{font-size:10px;letter-spacing:.14em;color:#c1bbb2;margin:18px 0 12px}.beats{display:flex;justify-content:center;gap:clamp(16px,7vw,34px);margin-bottom:24px}.beat{width:82px;height:82px;border-radius:50%;border:1.5px solid var(--l);display:grid;place-items:center;font-size:32px;font-weight:750}.beat.active{background:linear-gradient(145deg,var(--g),var(--g2));border-color:transparent;color:#fff;box-shadow:0 7px 18px rgba(18,63,45,.18)}
.play{width:100%;min-height:82px;border:0;border-radius:38px;background:linear-gradient(145deg,var(--g),var(--g2));color:#fff;font-size:21px;font-weight:800;letter-spacing:.14em;display:flex;justify-content:center;align-items:center;gap:18px}.footer{margin-top:26px;font-size:10px;letter-spacing:.30em;color:#244a3a;line-height:1.9}
@media(max-width:360px){.choice{min-height:96px;border-radius:28px}.beat{width:70px;height:70px}.grid{gap:9px}}
</style>
</head><body><main class="app">
<header><div class="brand">GOLF GUTS</div><div class="tag">DESIGN YOUR GOLF LIFE</div><div class="rule"><span>METRONOME</span></div></header>
<section class="grid"><button class="choice selected tempo" data-bpm="90"><span class="tempoName">標準</span><span class="bpm">BPM 90</span></button><button class="choice tempo" data-bpm="100"><span class="tempoName">速い</span><span class="bpm">BPM 100</span></button></section>
<section class="grid"><button class="choice tone selected sound" data-sound="A">A</button><button class="choice tone sound" data-sound="B">B</button></section>
<div class="signature">3 / 4</div><div class="beats"><div class="beat active">1</div><div class="beat">2</div><div class="beat">3</div></div>
<button id="play" class="play"><span id="icon">▶</span><span id="label">START</span></button><div class="footer">A BETTER SWING<br>A BRIGHTER TOMORROW</div>
</main>
<script>
(()=>{let bpm=90,sound="A",playing=false,beat=0,timer=0,ctx=null;
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)], beats=$$(".beat");
async function audioReady(){if(!ctx)ctx=new (window.AudioContext||window.webkitAudioContext)({latencyHint:"interactive"});if(ctx.state==="suspended")await ctx.resume();return ctx}
function choose(sel,el){$$(sel).forEach(x=>x.classList.toggle("selected",x===el))}
function beep(i){
 if(!ctx||ctx.state!=="running")return;
 const now=ctx.currentTime,o=ctx.createOscillator(),g=ctx.createGain(),first=i===0;
 o.type=sound==="A"?"square":"sine"; o.frequency.value=sound==="A"?(first?1320:990):(first?880:660);
 g.gain.setValueAtTime(0.0001,now);g.gain.exponentialRampToValueAtTime(sound==="A"?.18:.25,now+.006);
 g.gain.exponentialRampToValueAtTime(.0001,now+(sound==="A"?.11:.30));o.connect(g);g.connect(ctx.destination);o.start(now);o.stop(now+(sound==="A"?.12:.31));
}
function light(i){beats.forEach((x,n)=>x.classList.toggle("active",n===i))}
function fire(){if(!playing)return;light(beat);beep(beat);beat=(beat+1)%3;timer=window.setTimeout(fire,60000/bpm)}
async function start(){await audioReady();beep(0);playing=true;beat=1;light(0);$("#icon").textContent="Ⅱ";$("#label").textContent="STOP";timer=window.setTimeout(fire,60000/bpm)}
function stop(){playing=false;clearTimeout(timer);beat=0;light(0);$("#icon").textContent="▶";$("#label").textContent="START"}
$$(".tempo").forEach(b=>b.addEventListener("click",()=>{bpm=+b.dataset.bpm;choose(".tempo",b);if(playing){clearTimeout(timer);beat=0;fire()}}));
$$(".sound").forEach(b=>b.addEventListener("click",async()=>{sound=b.dataset.sound;choose(".sound",b);await audioReady();beep(0)}));
$("#play").addEventListener("click",()=>playing?stop():start());
document.addEventListener("visibilitychange",()=>{if(document.hidden&&playing)stop()});
})();
</script></body></html>
