<!doctype html>
<html lang="ja"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fdfcf7">
<title>GOLF GUTS METRONOME</title>
<style>
:root{--bg:#fdfcf7;--g:#02543f;--ink:#090909;--gray:#5e5e5e;--line:#cec9bf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:var(--ink)}
button{font:inherit;touch-action:manipulation}
.app{width:min(100%,430px);min-height:100dvh;margin:auto;padding:48px 18px 40px;text-align:center}
.logo{display:block;width:80%;height:auto;margin:0 auto 42px;mix-blend-mode:multiply}
.rule{display:flex;align-items:center;gap:18px;margin:0 16px 27px;color:var(--g)}
.rule:before,.rule:after{content:"";height:1.5px;background:var(--g);flex:1}
.rule b{font-size:20px;letter-spacing:.19em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-bottom:13px}
.ctrl{height:98px;border:2px solid var(--g);border-radius:31px;background:var(--bg);font-weight:800;padding:0;color:var(--ink)}
.ctrl.active{background:var(--g);color:#fff}
.main{display:block;font-size:39px;line-height:1}
.sub{display:block;font-size:16px;margin-top:10px;color:var(--gray);letter-spacing:.05em}
.ctrl.active .sub{color:#fff}
.sound .ctrl{height:75px;font-size:33px}
.signature{margin:27px 0 13px;color:#bdb7ad;font-size:13px;letter-spacing:.18em}
.beats{display:grid;grid-template-columns:repeat(3,1fr);gap:30px;margin:0 42px 34px}
.beat{aspect-ratio:1;border:2px solid var(--line);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:800;background:var(--bg)}
.beat.active{background:var(--g);border-color:var(--g);color:#fff}
.start{width:100%;height:88px;border:0;border-radius:44px;background:var(--g);color:#fff;display:flex;align-items:center;justify-content:center;gap:18px;font-size:29px;font-weight:800;letter-spacing:.13em}
#icon{width:28px;display:inline-flex;justify-content:center;font-size:23px}
.volume{margin-top:23px;height:62px;border:1.5px solid #ddd8cf;border-radius:28px;display:grid;grid-template-columns:50px 1fr 50px;gap:10px;align-items:center;padding:0 17px}
.volume label,.volume output{font-size:14px;font-weight:700}
#volume{width:100%;accent-color:var(--g)}
footer{margin-top:44px;color:var(--g);font-size:12px;letter-spacing:.29em;line-height:2.05}
@media(max-width:390px){
 .app{padding:41px 16px 34px} .logo{width:81%;margin-bottom:36px}
 .rule{margin-bottom:23px} .rule b{font-size:18px}
 .ctrl{height:90px} .main{font-size:35px} .sound .ctrl{height:69px}
 .beats{gap:25px;margin:0 38px 31px} .beat{font-size:31px}
 .start{height:81px} footer{margin-top:40px}
}
</style></head><body>

<div class="rule"><b>METRONOME</b></div>

<section class="grid">
<button id="b90" class="ctrl active"><span class="main">標準</span><span class="sub">BPM 90</span></button>
<button id="b100" class="ctrl"><span class="main">速い</span><span class="sub">BPM 100</span></button>
</section>
<section class="grid sound">
<button id="a" class="ctrl active">A音</button>
<button id="b" class="ctrl">B音</button>
</section>

<div class="signature">3 / 4</div>
<section class="beats">
<div class="beat active">1</div><div class="beat">2</div><div class="beat">3</div>
</section>

<button id="start" class="start"><span id="icon">▶</span><span id="startText">START</span></button>
<div class="volume"><label for="volume">音量</label><input id="volume" type="range" min="0" max="100" value="70" step="1"><output id="volumeText">70%</output></div>
<footer>A BETTER SWING<br>A BRIGHTER TOMORROW</footer>
</main>

<script>
"use strict";
let bpm=90,sound="A",running=false,beat=0,timer=null,ctx=null,master=null,volume=.70;
const $=id=>document.getElementById(id),beats=[...document.querySelectorAll(".beat")];
function pair(on,off){on.classList.add("active");off.classList.remove("active")}
function showBeat(i){beats.forEach((x,n)=>x.classList.toggle("active",n===i))}
async function ready(){
 try{
  if(!ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return false;ctx=new AC();master=ctx.createGain();master.gain.value=volume;master.connect(ctx.destination)}
  if(ctx.state!=="running")await ctx.resume();
  const z=ctx.createBuffer(1,1,22050),s=ctx.createBufferSource();s.buffer=z;s.connect(master);s.start(0);
  return ctx.state==="running";
 }catch(e){return false}
}
function playBeat(i){
 if(!ctx||ctx.state!=="running")return;
 const t=ctx.currentTime,first=i===0,o=ctx.createOscillator(),g=ctx.createGain();
 if(sound==="A"){
  o.type="square";o.frequency.setValueAtTime(first?1500:1250,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.30,t+.005);g.gain.exponentialRampToValueAtTime(.0001,t+.095);o.stop(t+.105);
 }else{
  o.type="sine";o.frequency.setValueAtTime(first?1750:720,t);
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(first?.32:.27,t+(first?.004:.012));g.gain.exponentialRampToValueAtTime(.0001,t+(first?.085:.34));o.stop(t+(first?.09:.35));
 }
 o.connect(g);g.connect(master);o.start(t);
}
function cycle(){if(!running)return;showBeat(beat);playBeat(beat);beat=(beat+1)%3;timer=setTimeout(cycle,60000/bpm)}
function restart(){if(running){clearTimeout(timer);beat=0;cycle()}}
async function startRun(){if(!await ready()){alert("Safariでページを開き直してからSTARTを押してください。");return}running=true;beat=0;$("icon").textContent="Ⅱ";$("startText").textContent="STOP";cycle()}
function stopRun(){running=false;clearTimeout(timer);timer=null;beat=0;showBeat(0);$("icon").textContent="▶";$("startText").textContent="START"}
$("b90").onclick=()=>{bpm=90;pair($("b90"),$("b100"));restart()};
$("b100").onclick=()=>{bpm=100;pair($("b100"),$("b90"));restart()};
$("a").onclick=async()=>{sound="A";pair($("a"),$("b"));if(await ready())playBeat(0)};
$("b").onclick=async()=>{sound="B";pair($("b"),$("a"));if(await ready())playBeat(0)};
$("start").onclick=()=>running?stopRun():startRun();
$("volume").oninput=e=>{const v=Number(e.target.value);volume=v/100;$("volumeText").textContent=v+"%";if(master&&ctx){master.gain.cancelScheduledValues(ctx.currentTime);master.gain.setTargetAtTime(volume,ctx.currentTime,.01)}};
</script></body></html>
